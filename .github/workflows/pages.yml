name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify page structure
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_page.py index.html
          python3 tools/check_contrast.py assets/site.css

      # Pages must already be enabled for this repository with the
      # "workflow" build type. The Actions token cannot create the Pages
      # site itself ("Resource not accessible by integration"), so it is
      # enabled once by the repository owner -- see README.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
