name: Magazine

on:
  schedule:
    # 04:20 UTC on the 4th: the application generates on the 3rd at 03:10 UTC.
    - cron: "20 4 4 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to publish, YYYY-MM (defaults to last month)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: magazine
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # Publication is gated on main: Pages deploys from main, and the
      # overwrite guard below only means anything against main's issues/.
      - name: Publish from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "magazine.yml publishes from main; dispatch it there." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide which month to publish
        id: month
        env:
          # The dispatch input is untrusted: keep it in the environment and let
          # tools/publish.py validate it. It is never interpolated into a shell
          # script, so a value like $(...) cannot execute.
          INPUT_MONTH: ${{ github.event.inputs.month }}
        run: |
          set -euo pipefail
          month=$(python3 tools/publish.py decide-month)
          echo "month=$month" >> "$GITHUB_OUTPUT"
          echo "Publishing $month"

      - name: Refuse to overwrite a published issue
        env:
          MONTH: ${{ steps.month.outputs.month }}
        run: |
          set -euo pipefail
          target="issues/${MONTH}.html"
          if [ -f "$target" ]; then
            echo "$target already exists; a merged issue is never rewritten." >&2
            echo "Delete it deliberately if a republish is really wanted." >&2
            exit 1
          fi

      - name: Connect to the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.NAS_TAILSCALE_HOST }}

      - name: Fetch the generated issue
        env:
          BASE: http://${{ vars.NAS_TAILSCALE_HOST }}:${{ vars.NAS_HOST_PORT || '8788' }}
          MONTH: ${{ steps.month.outputs.month }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 60 "$BASE/api/magazine/$MONTH")
          if [ "$code" != "200" ]; then
            echo "The application returned HTTP $code for $MONTH." >&2
            echo "Has hello_weather.generate_magazine_issue run yet?" >&2
            exit 1
          fi
          # publish.py refuses a response whose month differs from the request,
          # builds the path only from the validated request, and never
          # overwrites an existing issue.
          python3 tools/publish.py write-issue \
            --response response.json --month "$MONTH" --issues issues
          rm -f response.json

      - name: Rebuild the index and the feed
        run: python3 tools/build_archive.py --issues issues

      - name: Verify the new page
        env:
          MONTH: ${{ steps.month.outputs.month }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_page.py "issues/${MONTH}.html"
          python3 tools/check_page.py issues/index.html
          python3 tools/check_contrast.py assets/site.css
          python3 tools/check_contrast.py --extension assets/magazine.css

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: magazine/${{ steps.month.outputs.month }}
          title: "Magazine: ${{ steps.month.outputs.month }}"
          commit-message: "feat: add the ${{ steps.month.outputs.month }} issue"
          body: |
            Generated by the application and collected over the tailnet.

            Read the issue in the diff before merging. Merging publishes it:
            Pages deploys from `main`.

            - Issue: `issues/${{ steps.month.outputs.month }}.html`
            - Index and feed rebuilt from the `issues/` directory
          add-paths: |
            issues/
            feed.xml
